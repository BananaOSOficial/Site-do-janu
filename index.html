<!DOCTYPE html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<style>
    @media (max-width: 768px), (pointer: coarse) {
      menu {
        height: 100svw;
      }
      h1 {
        font-size: large;
      }
    }
		* {
			margin: 0;
		}
		body {
			background-color: #303134;
			color: #000;
		}
		header {
			position: relative;
			top: 0;
			background: url('Logodojanu.png'), linear-gradient(90deg, #4A7C59, #6FB873);
			border-bottom: 2px solid #3A5F46;
			background-size: contain, cover;
			background-position: center, center;
			background-repeat: no-repeat, no-repeat;
			height: 50px;
      padding-bottom: 5px;
		}
		.menu {
			position: fixed;
			display: flex;
			flex-direction: column;
			top: 0;
			left: 0;
			width: 200px;
			height: 100dvh;
			transform: translateX(-110%);
			background: linear-gradient(#4A7C59, #6FB873) padding-box;
			border-radius: 0 20px 20px 0;
			transition: transform 0.35s ease;
			border-right: 2px solid #3A5F46;
		}
		.menu.aberto {
			transform: translateX(0);
		}
		.menu button {
			display: flex;
			flex-direction: row;
		  border-radius: 14px;
		  background: #3A5F46;
		  width: 90%;
		  margin-top: 10px;
      border: 1px solid #30363D;
      margin-left: 10px;
		  padding-top: 20px;
		  padding-bottom: 20px;
		  height: 32px;
		  font-weight: bolder;
		  align-items: center;
		  color: #F0F0F0;
      gap: 5px;
			opacity: 0.5;
      transition: background 0.35s ease, transform 0.35s ease, border 0.35s ease, opacity 0.35s ease;
	  }
	  .menu button svg {
		  width: 32px;
		  height: 32px;
	  }
	  .menu button:hover {
		  background: linear-gradient(90deg, #4A7C59, #6FB873) padding-box;
		  color: #fff;
      border-color: #3a5f46;
      transform: scale(1.05);
		  opacity: 1;
	  }
	  .menu button svg path {
		  transition: fill 0.35s ease;
      fill: #fff;
	  }
	  .menu button:hover svg path {
		  fill: #fff;
	  }
	  header #abrirmenubtn {
		  display: flex;
		  position: absolute;
      transform: translateY(-50%);
		  top: 50%;
      left: 4px;
		  color: #fff;
		  width: 34px;
		  height: 34px;
		  background: transparent;
		  border: 1px solid transparent;
		  align-items: center;
		  border-radius: 999px;
      z-index: 100;
		  transition: background 0.5s ease, left 0.35s ease;
    }
	  #abrirmenubtn:hover {
		  background: linear-gradient(#4A7C59, #6FB873) padding-box, linear-gradient(#3A5F46) border-box;
	  }
    #abrirmenubtn.selecionado {
      background: linear-gradient(#4A7C59, #6FB873) padding-box, linear-gradient(#3A5F46) border-box;
    }
    #abrirmenubtn.selecionado svg path {
      fill: green;
    }
	  #abrirmenubtn svg {
		  width: 32px;
		  height: 32px;
	  }
	  #abrirmenu svg path {
		  transition: fill 0.35s ease;
	  }
	  #abrirmenubtn:hover svg path {
		  fill: green;
	  }
	  #janelacontato {
		  position: fixed;
		  top: 0;
		  width: 100dvw;
		  height: 100dvh;
		  flex-direction: grid;
      z-index: 102;
		  background: linear-gradient(90deg, #fff, #f5f5f5) padding-box;
		  transform: translateY(-110%);
		  transition: transform 0.35s ease;
	  }
    #janelacontato p {
      margin-top: 10px;
      font-weight: bold;
      margin-left: 20px;
    }
	  #janelacontato h1 {
      position: relative;
      width: 100%;
      padding-top: 10px;
      padding-bottom: 20px;
      background-color: #E0E0E0;
		  text-align: center;
      text-decoration: underline;
	  }
	  #janelacontato.aberta {
		  transform: translateY(0);
	  }
	  #whatsapp {
		  display: flex;
		  align-items: center;
      background: linear-gradient(#88E788,#7cfc00);
      height: fit-content;
      width: fit-content;
      border-radius: 14px;
		  align-self: center;
      padding: 10px;
		  margin-left: 20px;
		  margin-top: 10px;
		  gap: 2px;
		  font-weight: bold;
		  color: green;
	  }
	  #whatsapp svg {
		  width: 32px;
		  height: 32px;
	  }
	  #whatsapp svg path {
		  fill: green;
	  }
	  .fecharjanelacontato {
		  position: fixed;
		  top: 5px;
		  left: 5px;
		  background: transparent;
		  width: 32px;
		  height: 32px;
      z-index: 100;
		  border: none;
	  }
	  .fecharjanelacontato svg {
		  width: 32px;
		  height: 32px;
	  }
	  .fecharjanelacontato svg path {
		  transition: fill 0.35s ease;
      fill: #000;
	  }
	  .fecharjanelacontato:hover svg path {
		  fill: #7CFC00;
	  }
    .menubtns {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 5px;
    }
    .menu h2 {
      text-align: center;
      color: #fff;
      width: 100%;
      padding-bottom: 5px;
      border-radius: 0 20px 0 0;
    }
	</style>
</head>

<script>
const abrirmenubtn = document.getElementById('abrirmenubtn');
const menu = document.querySelector('.menu');
const contato = document.querySelector('.contato');
const janelacontato = document.getElementById('janelacontato');
const fecharjanelacontato = document.querySelector('.fecharjanelacontato');

contato.onclick = function() {
  abrirmenubtn.classList.remove('selecionado');
  menu.classList.remove('aberto');
  abrirmenubtn.style.left = '5px';
	janelacontato.classList.add('aberta');
}
fecharjanelacontato.onclick = function() {
	janelacontato.classList.remove('aberta');
}
abrirmenubtn.onclick = function() {
	if (menu.classList.contains('aberto')) {
	abrirmenubtn.style.left = '5px';
	menu.classList.remove('aberto');
  abrirmenubtn.classList.remove('selecionado');
} else {
	abrirmenubtn.style.left = '210px';
	menu.classList.add('aberto');
  abrirmenubtn.classList.add('selecionado');
}
}
</script>
